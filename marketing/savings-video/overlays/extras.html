<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { font-family: 'Heebo', sans-serif; }

  /* intro caption (top-left) */
  #intro {
    display: none;
    position: absolute; top: 60px; left: 60px;
    max-width: 760px;
    color: #f7f4ee;
    font-size: 54px; font-weight: 800; line-height: 1.3;
    text-align: right;
    text-shadow: 0 3px 14px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.9);
    direction: rtl;
  }

  /* disclaimer (bottom-right) */
  #disc {
    display: none;
    position: absolute; bottom: 34px; right: 40px;
    max-width: 620px;
    color: rgba(247,244,238,0.9);
    font-size: 26px; font-weight: 400; line-height: 1.35;
    text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    direction: rtl;
  }
</style>
</head>
<body>
  <div id="intro">שיחה נפוצה בין חברים בשנת 2026…</div>
  <div id="disc">* האמור אינו מהווה ייעוץ השקעות, יש לפנות לייעוץ אישי</div>
<script>
  const which = new URLSearchParams(location.search).get('el');
  const el = document.getElementById(which);
  if (el) el.style.display = 'block';
</script>
</body>
</html>
