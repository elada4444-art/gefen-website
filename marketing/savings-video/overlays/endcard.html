<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    font-family: 'Heebo', sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #1c2a4a 0%, #121d36 60%, #0c1426 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 56px;
    color: #f7f4ee;
    text-align: center;
  }
  .logo-card {
    background: #ffffff;
    border-radius: 32px;
    padding: 44px 60px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
  }
  .logo-card img { width: 620px; display: block; }
  h1 {
    font-size: 88px; font-weight: 900; line-height: 1.2;
    max-width: 900px;
  }
  h1 .accent { color: #f07d1a; }
  .sub {
    font-size: 52px; font-weight: 400; color: #f7f4ee; opacity: 0.9;
    max-width: 860px; line-height: 1.35;
  }
  .cta {
    margin-top: 12px;
    background: linear-gradient(270deg, #f07d1a, #ffa14e);
    color: #121d36;
    font-size: 56px; font-weight: 800;
    padding: 30px 70px;
    border-radius: 60px;
    box-shadow: 0 10px 34px rgba(240,125,26,0.45);
  }
  .phone {
    font-size: 48px; font-weight: 600; color: #f7f4ee;
  }
  .phone bdi { direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
  <div class="logo-card"><img src="../assets/gefen-logo.png" alt="גפן ביטוח ופיננסים"></div>
  <h1>אל תשאירו את הכסף <span class="accent">בעו״ש</span></h1>
  <div class="sub">פוליסת חיסכון שעובדת בשבילכם — עם ליווי אישי של גפן ביטוח ופיננסים</div>
  <div class="cta">דברו איתנו עוד היום</div>
  <div class="phone">☎ <bdi>03-5727277</bdi> &nbsp;|&nbsp; WhatsApp</div>
</body>
</html>
