name: fetch-assets

on:
  push:
    branches:
      - claude/financial-savings-marketing-video-prh9oc
    paths:
      - marketing/savings-video/fetch-manifest.json

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          MANIFEST=marketing/savings-video/fetch-manifest.json
          DEST=$(jq -r '.dest // "marketing/savings-video/incoming"' "$MANIFEST")
          mkdir -p "$DEST"
          jq -c '.files[]' "$MANIFEST" | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            name=$(echo "$item" | jq -r '.name')
            echo "Fetching $name"
            curl -sSL --fail --max-time 300 -o "$DEST/$name" "$url"
            ls -la "$DEST/$name"
          done
      - name: Commit and push
        run: |
          DEST=$(jq -r '.dest // "marketing/savings-video/incoming"' marketing/savings-video/fetch-manifest.json)
          git config user.name "gefen-assets-bot"
          git config user.email "actions@github.com"
          git add -A
          git add -f "$DEST"
          git commit -m "Fetch generated assets" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
